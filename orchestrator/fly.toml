# Fly.io production config for Crucible Stateless Cloud Sandbox Orchestrator (Firecracker KVM Control Plane)
app = "crucible-sandbox-orchestrator"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SPARTAN_SANDBOX_BACKEND = "fly"
  FLY_SANDBOX_APP_NAME = "crucible-sandboxes"
  FLY_SANDBOX_REGION = "iad"
  FLY_SANDBOX_IMAGE = "registry.fly.io/crucible-sandboxes:v9"
  FLY_WARM_POOL_SIZE = "0"
  SPARTAN_TERMINAL_WS_URL = "wss://crucible-sandbox-orchestrator.fly.dev/v1/sandboxes"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024
