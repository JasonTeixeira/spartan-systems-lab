# Fly.io production config for Crucible Cloud Sandbox Orchestrator
app = "crucible-sandbox-orchestrator"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SPARTAN_SANDBOX_BACKEND = "memory"
  SPARTAN_TERMINAL_WS_URL = "wss://crucible-sandbox-orchestrator.fly.dev/v1/sandboxes"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
