services:
  # ------------------------------------------------------------------
  # EDGE / PUBLIC SUBNET (edge_net + app_net)
  # ------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: spartan-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge_net
      - app_net

  # ------------------------------------------------------------------
  # APPLICATION TIER (app_net + private_data_net)
  # ------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: lab-1-core-engine/Dockerfile.api
    container_name: spartan-api
    environment:
      DATABASE_URL: postgresql://spartan:spartanpass@pgbouncer:6432/spartan_lab
      DIRECT_DATABASE_URL: postgresql://spartan:spartanpass@postgres:5432/spartan_lab
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app_net
      - private_data_net

  # ------------------------------------------------------------------
  # PRIVATE DATA SUBNET (private_data_net ONLY -- unreachable from edge_net)
  # ------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p0
    container_name: spartan-pgbouncer
    environment:
      DB_USER: spartan
      DB_PASSWORD: spartanpass
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: spartan_lab
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private_data_net

  postgres:
    image: postgres:16-alpine
    container_name: spartan-postgres
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "log_min_duration_statement=250"
    environment:
      POSTGRES_USER: spartan
      POSTGRES_PASSWORD: spartanpass
      POSTGRES_DB: spartan_lab
    ports:
      # Exposed on localhost ONLY for your local host scripts/drills
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spartan -d spartan_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - private_data_net

  redis:
    image: redis:7-alpine
    container_name: spartan-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - private_data_net

  # ------------------------------------------------------------------
  # LINUX SRE & NETWORK FORENSICS TOOLBOX
  # Attached to all subnets so you can run ss, tcpdump, strace, dig, tc, iostat, psql
  # ------------------------------------------------------------------
  sre-toolbox:
    build:
      context: .
      dockerfile: Dockerfile.sre
    container_name: spartan-sre-toolbox
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    networks:
      - edge_net
      - app_net
      - private_data_net

networks:
  edge_net:
    driver: bridge
  app_net:
    driver: bridge
  private_data_net:
    driver: bridge
    internal: true

volumes:
  pg_data:
